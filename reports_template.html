<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Relatórios de Empresas e FIIs" />
    <title>Relatórios</title>
    <style>
        h2 {
            text-align: center;
            font-family: Consolas, monospace;
            font-size: 1.5rem;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            margin: auto;
            font: 0.75rem Consolas, monospace;
            min-width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, .15)
        }

        thead tr {
            background: #003475;
            color: #fff;
            text-align: left;
            font-size: .9rem
        }

        tr#titulo>th {
            padding: 10px 12px 0;
        }

        th {
            padding: 10px 12px 12px;
        }

        th:first-child input {
            width: 8ch;
        }

        td {
            padding: 6px 2px 6px 12px;
        }

        td:first-child {
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #ddd
        }

        tbody tr:nth-of-type(2n) {
            background: #f3f3f3
        }

        tbody tr:last-of-type {
            border-bottom: 2px solid #003475
        }

        tbody tr:hover {
            background: #ff9
        }

        @media (max-width: 600px) {

            table tr th:nth-child(4),
            table tr td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>

<body>
    <h2>Relatórios de Empresas e FIIs</h2>
    <table id="tabela">
        <thead>
            <tr id="titulo">
                <th>Empresa</th>
                <th>Nome</th>
                <th>Data</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody>{rows}</tbody>
    </table>

    <script>
        // Função debounce
        function debounce(fn, delay) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        const tabela = document.getElementById('tabela');
        const thead = tabela.querySelector('thead');
        const headerRow = thead.rows[0];
        const colunas = headerRow.cells.length;

        // Cria uma nova linha para os inputs
        const filterRow = document.createElement('tr');
        for (let i = 0; i < colunas; i++) {
            const th = document.createElement('th');
            const input = document.createElement('input');
            input.type = 'search';
            input.placeholder = `Filtrar ${headerRow.cells[i].textContent}`;
            input.dataset.coluna = i;
            th.appendChild(input);
            filterRow.appendChild(th);
        }
        thead.appendChild(filterRow);

        // Função de filtragem
        function filtrarTabela() {
            const filtros = Array.from(filterRow.querySelectorAll('input')).map(input => input.value.toLowerCase());
            const linhas = tabela.tBodies[0].rows;
            for (let linha of linhas) {
                let mostrar = true;
                for (let i = 0; i < colunas; i++) {
                    const filtro = filtros[i];
                    if (filtro && !linha.cells[i].textContent.toLowerCase().includes(filtro)) {
                        mostrar = false;
                        break;
                    }
                }
                linha.style.display = mostrar ? '' : 'none';
            }
        }

        // Adiciona o evento de debounce aos inputs
        filterRow.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', debounce(filtrarTabela, 300));
        });
    </script>
</body>

</html>
