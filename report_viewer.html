<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Empresas e FIIs</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A6%85%3C/text%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
    </script>

    <link type="text/css" rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/alumuko/vanilla-datetimerange-picker@latest/extra/vanilla-datetimerange-picker-dark.css">
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js" type="text/javascript"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/alumuko/vanilla-datetimerange-picker@latest/dist/vanilla-datetimerange-picker.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Custom scrollbar for dark mode */
        .dark ::-webkit-scrollbar-thumb {
            background-color: #4a5568;
            border-radius: 8px;
        }

        .dark ::-webkit-scrollbar-track {
            background-color: #2d3748;
        }

        /* Styling for the modal */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        /* Hide filename column on small screens */
        @media (max-width: 768px) {
            .hide-on-mobile {
                display: none;
            }
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col items-center p-4">

    <div id="app"
        class="w-full lg:max-w-[calc(90%)] bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 space-y-6 transition-colors duration-300">
        <header class="flex justify-between items-center pb-4 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center space-x-4 sm:space-x-2">
                <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-200">Relatórios de Empresas e FIIs</h1>
                <button id="update-indicator" title="Clique para atualizar" aria-label="Clique para atualizar"
                    class="p-1 rounded-full text-2xl hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none transition-colors duration-200"
                    disabled>
                    <span id="mailbox-empty"> 📭 </span>
                    <span id="mailbox-full" class="hidden"> 📬 </span>
                </button>
            </div>
            <div class="flex items-center space-x-2">
                <button id="configBtn" title="Abrir configurações" aria-label="Abrir configurações"
                    class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none transition-colors duration-200">
                    ⚙️
                </button>
                <button id="themeToggle" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro"
                    class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none transition-colors duration-200">
                    <span id="moonIcon">🌙</span>
                    <span id="sunIcon" class="hidden">☀️</span>
                </button>
            </div>
        </header>

        <div id="loadingIndicator" class="hidden flex items-center justify-center p-4 text-blue-600 dark:text-blue-400">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            Buscando dados...
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                <thead id="reportTableHeader" class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="px-1 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider cursor-pointer"
                            data-sort-by="code">Empresa <span id="codeSortIcon" class="inline-block"></span>
                        </th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider cursor-pointer"
                            data-sort-by="type"> Tipo de Relatório <span id="typeSortIcon"
                                class="inline-block ml-1"></span>
                        </th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider cursor-pointer"
                            data-sort-by="dateTime"> Data & Hora <span id="dateTimeSortIcon"
                                class="inline-block ml-1"></span>
                        </th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider hide-on-mobile"
                            data-sort-by="filename">
                            Nome do Arquivo <span id="filenameSortIcon" class="inline-block ml-1"></span>
                        </th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"
                    class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                </tbody>
            </table>
        </div>

        <div
            class="flex flex-col sm:flex-row justify-between items-center pt-4 border-t border-gray-200 dark:border-gray-700 space-y-4 sm:space-y-0">
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-700 dark:text-gray-300">Itens por página:</span>
                <select id="itemsPerPageSelect"
                    class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-gray-100 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div id="paginationControls" class="flex flex-wrap justify-center items-center gap-2">
            </div>
        </div>
    </div>

    <div id="configModal" class="fixed inset-0 hidden flex items-center justify-center p-4 z-50 modal-overlay">
        <div
            class="modal-content bg-white dark:bg-gray-800 rounded-xl p-8 space-y-6 w-full max-w-md border border-gray-200 dark:border-gray-700 shadow-xl transition-all duration-300 transform scale-95 opacity-0">
            <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-200 text-center">Configuração</h2>
            <div class="space-y-4">
                <div>
                    <label for="tickerFilter"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Códigos de Ticker
                        (separados por vírgula):</label>
                    <input type="text" id="tickerFilter"
                        class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <div class="flex flex-col sm:flex-row justify-end space-y-3 sm:space-y-0 sm:space-x-3 mt-6">
                <button id="cancelCloseConfigBtn"
                    class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-medium rounded-lg transition-colors duration-200">Fechar</button>
                <button id="saveConfigBtn"
                    class="px-5 py-2.5 bg-gray-500 hover:bg-gray-600 text-white font-medium rounded-lg transition-colors duration-200">Salvar</button>
                <button id="saveReloadConfigBtn"
                    class="px-5 py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg transition-colors duration-200">Salvar
                    e Recarregar</button>
            </div>
        </div>
    </div>

    <script>
        // =================================================================================
        // SCRIPT START
        // =================================================================================
        document.addEventListener('DOMContentLoaded', () => {

            // --- CONSTANTS ---
            const constants = {
                API_BASE_URL: '/api/news',
                DEBOUNCE_DELAY: 600,
                NEW_REPORT_CHECK_INTERVAL: 6000, // 1 minute
                LOCAL_STORAGE_KEY: 'reportViewerConfig',
                DEFAULT_PAGE_SIZE: 20,
                MAX_PAGINATION_PAGES_TO_SHOW: 5,
            };

            // --- STATE MANAGEMENT ---
            const state = {
                reports: [],
                currentPage: 1,
                totalPagesFromServer: 0,
                totalRecords: 0,
                sort: {
                    column: 'dateTime',
                    direction: 'desc'
                },
                filter: {
                    code: '',
                    type: '',
                    date: '',
                    fileName: ''
                },
                config: {
                    ticker: '',
                    hasNewReports: false,
                    intervalForNewReports: null,
                    localRecordCount: 0,
                },
                hasConfigChanged: false
            };

            // --- DOM ELEMENT REFERENCES ---
            const elements = {
                app: document.getElementById('app'),
                tableHeader: document.getElementById('reportTableHeader'),
                tableHeaders: document.querySelectorAll('th[data-sort-by]'),
                tableBody: document.getElementById('reportTableBody'),
                loadingIndicator: document.getElementById('loadingIndicator'),
                itemsPerPageSelect: document.getElementById('itemsPerPageSelect'),
                paginationControls: document.getElementById('paginationControls'),
                theme: {
                    toggleBtn: document.getElementById('themeToggle'),
                    moonIcon: document.getElementById('moonIcon'),
                    sunIcon: document.getElementById('sunIcon'),
                },
                modal: {
                    configBtn: document.getElementById('configBtn'),
                    modal: document.getElementById('configModal'),
                    content: document.querySelector('.modal-content'),
                    tickerInput: document.getElementById('tickerFilter'),
                    cancelBtn: document.getElementById('cancelCloseConfigBtn'),
                    saveBtn: document.getElementById('saveConfigBtn'),
                    saveReloadBtn: document.getElementById('saveReloadConfigBtn'),
                },
                updateIndicator: document.getElementById('update-indicator'),
                mailboxEmpty: document.getElementById('mailbox-empty'),
                mailboxFull: document.getElementById('mailbox-full'),
            };


            // --- UTILITY FUNCTIONS ---
            function debounce(fn, delay) {
                let timeout;
                return function (...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            function formatDate(dateString) {
                const date = new Date(dateString);
                if (isNaN(date)) return dateString;
                const options = {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit',
                    timeZone: 'America/Sao_Paulo',
                    hour12: false
                };
                return date.toLocaleString('pt-BR', options).replace(',', '');
            }

            function emptyMailbox() {
                state.config.hasNewReports = false;
                elements.updateIndicator.disabled = true;
                elements.mailboxEmpty.classList.remove('hidden');
                elements.mailboxFull.classList.add('hidden');
            }

            function fillMailbox() {
                state.config.hasNewReports = true;
                elements.updateIndicator.disabled = false;
                elements.mailboxEmpty.classList.add('hidden');
                elements.mailboxFull.classList.remove('hidden');
            }


            // --- API & DATA HANDLING ---
            function appendFilterParams(params) {
                const codes = state.filter.code
                    ? state.filter.code.trim().toUpperCase()
                    : state.config.ticker.split(',').map(t => t.trim()).filter(Boolean).join(',');

                if (codes) params.append('codes', codes);
                if (state.filter.type) params.append('reportType', state.filter.type);
                if (state.filter.date) params.append('date', state.filter.date);
                if (state.filter.fileName) params.append('fileName', state.filter.fileName);
            }

            async function fetchData(updateRecords = false) {
                showLoading();
                try {
                    const params = new URLSearchParams({
                        page: state.currentPage,
                        pageSize: elements.itemsPerPageSelect.value || constants.DEFAULT_PAGE_SIZE,
                        sortBy: state.sort.column,
                        sortDirection: state.sort.direction,
                        clientRecordCount: state.config.localRecordCount,
                        updateRecords: updateRecords,
                    });
                    appendFilterParams(params);

                    const apiUrl = `${constants.API_BASE_URL}?${params.toString()}`;
                    console.log("Fetching from:", apiUrl);

                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    state.reports = data.news || [];
                    state.totalPagesFromServer = data.totalPages || 0;
                    state.totalRecords = data.totalRecords || 0;

                    if (updateRecords) {
                        console.debug("Updating local record count from server:", updateRecords, state.totalRecords);
                        state.config.localRecordCount = state.totalRecords;
                    }

                    renderTable();
                    renderPaginationControls();

                } catch (error) {
                    console.error('Error fetching data:', error);
                    elements.tableBody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-500">Falha ao carregar dados. Por favor, tente novamente.</td></tr>`;
                    state.reports = [];
                    state.totalPagesFromServer = 0;
                    renderTable();
                    renderPaginationControls();
                } finally {
                    hideLoading();
                    elements.app.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            async function checkForNewReports() {
                try {
                    const params = new URLSearchParams();
                    appendFilterParams(params);

                    const response = await fetch(`${constants.API_BASE_URL}/count?${params.toString()}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    const totalRecords = data.totalRecords || 0;

                    if (state.config.localRecordCount === 0) {
                        state.config.localRecordCount = totalRecords;
                    }

                    if (totalRecords > state.config.localRecordCount) {
                        fillMailbox();
                    } else {
                        emptyMailbox();
                    }
                } catch (error) {
                    console.error('Error checking for new reports:', error);
                }
            }


            // --- UI RENDERING & MANIPULATION ---
            function showLoading() {
                elements.loadingIndicator.classList.remove('hidden');
            }

            function hideLoading() {
                elements.loadingIndicator.classList.add('hidden');
            }

            function renderTable() {
                elements.tableBody.innerHTML = '';
                if (state.reports.length === 0) {
                    const message = state.totalRecords > 0 ? "Nenhum relatório para esta página." : "Nenhum relatório encontrado com seus critérios.";
                    const row = elements.tableBody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 4;
                    cell.className = 'py-4 text-center text-gray-500 dark:text-gray-400';
                    cell.textContent = message;
                    return;
                }

                const fragment = document.createDocumentFragment();
                state.reports.forEach(report => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-150';

                    const tickerCell = document.createElement('td');
                    tickerCell.className = 'px-4 py-2 whitespace-nowrap text-sm font-semibold text-gray-900 dark:text-gray-100';
                    tickerCell.textContent = report.ticker || 'N/A';
                    row.appendChild(tickerCell);

                    const typeCell = document.createElement('td');
                    typeCell.className = 'px-4 py-2 md:whitespace-nowrap text-sm';
                    const typeLink = document.createElement('a');
                    typeLink.href = report.url;
                    typeLink.target = '_blank';
                    typeLink.rel = 'noopener noreferrer';
                    typeLink.className = 'text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-200 visited:text-purple-600';
                    typeLink.textContent = report.reportType || 'N/A';
                    typeCell.appendChild(typeLink);
                    row.appendChild(typeCell);

                    const dateCell = document.createElement('td');
                    dateCell.className = 'px-4 py-2 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400';
                    dateCell.textContent = formatDate(report.dateTime);
                    row.appendChild(dateCell);

                    const filenameCell = document.createElement('td');
                    filenameCell.className = 'px-4 py-2 whitespace-nowrap text-sm hide-on-mobile';
                    const filenameLink = document.createElement('a');
                    filenameLink.href = report.url;
                    filenameLink.target = '_blank';
                    filenameLink.rel = 'noopener noreferrer';
                    filenameLink.className = 'text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-200 visited:text-purple-600';
                    filenameLink.textContent = report.filename || 'N/A';
                    filenameCell.appendChild(filenameLink);
                    row.appendChild(filenameCell);

                    fragment.appendChild(row);
                });
                elements.tableBody.appendChild(fragment);
            }

            function renderPaginationControls() {
                elements.paginationControls.innerHTML = '';
                const totalPages = state.totalPagesFromServer;
                if (totalPages <= 1) return;

                const createButton = (text, pageNum, isDisabled = false, isActive = false) => {
                    const button = document.createElement('button');
                    button.textContent = text;
                    let baseClasses = 'px-3 py-1.5 rounded-lg text-sm font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500';
                    if (isActive) button.className = `${baseClasses} bg-blue-500 text-white`;
                    else if (isDisabled) button.className = `${baseClasses} bg-gray-200 text-gray-400 dark:bg-gray-700 dark:text-gray-500 cursor-not-allowed`;
                    else button.className = `${baseClasses} bg-gray-50 hover:bg-gray-200 text-gray-700 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-gray-300`;

                    if (!isDisabled) button.addEventListener('click', () => goToPage(pageNum));
                    button.disabled = isDisabled;
                    return button;
                };

                const createEllipsis = () => {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.className = 'px-3 py-1.5 text-sm text-gray-700 dark:text-gray-300';
                    return ellipsis;
                };

                elements.paginationControls.appendChild(createButton('Anterior', state.currentPage - 1, state.currentPage === 1));

                const maxPagesToShow = constants.MAX_PAGINATION_PAGES_TO_SHOW;
                if (totalPages > maxPagesToShow) {
                    let startPage = Math.max(1, state.currentPage - 2);
                    let endPage = Math.min(totalPages, state.currentPage + 2);

                    if (state.currentPage < 4) {
                        startPage = 1;
                        endPage = maxPagesToShow;
                    } else if (state.currentPage > totalPages - 3) {
                        startPage = totalPages - maxPagesToShow + 1;
                        endPage = totalPages;
                    }

                    if (startPage > 1) {
                        elements.paginationControls.appendChild(createButton('1', 1));
                        if (startPage > 2) elements.paginationControls.appendChild(createEllipsis());
                    }

                    for (let i = startPage; i <= endPage; i++) {
                        elements.paginationControls.appendChild(createButton(String(i), i, false, i === state.currentPage));
                    }

                    if (endPage < totalPages) {
                        if (endPage < totalPages - 1) elements.paginationControls.appendChild(createEllipsis());
                        elements.paginationControls.appendChild(createButton(String(totalPages), totalPages));
                    }
                } else {
                    for (let i = 1; i <= totalPages; i++) {
                        elements.paginationControls.appendChild(createButton(String(i), i, false, i === state.currentPage));
                    }
                }

                elements.paginationControls.appendChild(createButton('Próxima', state.currentPage + 1, state.currentPage === totalPages));
            }

            function updateSortIcons() {
                document.querySelectorAll('th[data-sort-by] span').forEach(span => span.textContent = '');
                const iconSpan = document.getElementById(`${state.sort.column}SortIcon`);
                if (iconSpan) {
                    iconSpan.textContent = state.sort.direction === 'asc' ? ' ▲' : ' ▼';
                }
            }


            // --- THEME & MODAL MANAGEMENT ---
            function initializeTheme() {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                    elements.theme.moonIcon.classList.add('hidden');
                    elements.theme.sunIcon.classList.remove('hidden');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            function toggleDarkMode() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                elements.theme.moonIcon.classList.toggle('hidden', isDark);
                elements.theme.sunIcon.classList.toggle('hidden', !isDark);
            }

            function openConfigModal() {
                elements.modal.tickerInput.value = state.config.ticker;
                state.hasConfigChanged = false;
                updateConfigButtons();
                elements.modal.modal.classList.remove('hidden');
                setTimeout(() => elements.modal.content.classList.remove('scale-95', 'opacity-0'), 10);
            }

            function closeConfigModal() {
                elements.modal.content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => elements.modal.modal.classList.add('hidden'), 300);
            }

            function updateConfigButtons() {
                const btn = elements.modal.cancelBtn;
                if (state.hasConfigChanged) {
                    btn.textContent = 'Cancelar';
                    btn.classList.remove('bg-gray-200', 'hover:bg-gray-300', 'dark:bg-gray-700', 'dark:hover:bg-gray-600', 'text-gray-800', 'dark:text-gray-200');
                    btn.classList.add('bg-red-500', 'hover:bg-red-600', 'text-white');
                } else {
                    btn.textContent = 'Fechar';
                    btn.classList.remove('bg-red-500', 'hover:bg-red-600', 'text-white');
                    btn.classList.add('bg-gray-200', 'hover:bg-gray-300', 'dark:bg-gray-700', 'dark:hover:bg-gray-600', 'text-gray-800', 'dark:text-gray-200');
                }
            }

            function saveConfig() {
                state.config.ticker = elements.modal.tickerInput.value.trim();
                localStorage.setItem(constants.LOCAL_STORAGE_KEY, JSON.stringify(state.config));
                state.hasConfigChanged = false;
                updateConfigButtons();
            }

            function loadConfigFromLocalStorage() {
                const saved = localStorage.getItem(constants.LOCAL_STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && typeof parsed === 'object') {
                            state.config = { ...state.config, ...parsed };
                        }
                    } catch (e) {
                        console.error("Failed to parse config from localStorage", e);
                    }
                }
            }


            // --- EVENT HANDLERS ---
            const handleFilterChange = debounce(() => {
                const code = document.getElementById('filter-input-0').value.toUpperCase();
                const newFilters = {
                    code: code.length === 0 || code.length === 4 ? code : state.filter.code,
                    type: document.getElementById('filter-input-1').value.toUpperCase(),
                    date: document.getElementById('filter-input-2').value,
                    fileName: document.getElementById('filter-input-3').value.toUpperCase()
                };

                if (JSON.stringify(newFilters) !== JSON.stringify(state.filter)) {
                    state.currentPage = 1;
                    state.filter = newFilters;
                    fetchData(true);
                }
            }, constants.DEBOUNCE_DELAY);

            function goToPage(pageNum) {
                if (pageNum >= 1 && pageNum <= state.totalPagesFromServer) {
                    state.currentPage = pageNum;
                    fetchData();
                }
            }

            function handleSort(column) {
                if (state.sort.column === column) {
                    state.sort.direction = state.sort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    state.sort.column = column;
                    state.sort.direction = 'asc';
                }
                state.currentPage = 1;
                updateSortIcons();
                fetchData();
            }

            function initializeFilterRow() {
                const filterRow = document.createElement('tr');
                const headerRow = elements.tableHeader.rows[0];
                const columnCount = headerRow.cells.length;

                for (let i = 0; i < columnCount; i++) {
                    const th = document.createElement('th');
                    const input = document.createElement('input');
                    input.type = 'search';
                    input.placeholder = `Filtrar ${headerRow.cells[i].textContent.trim()}`;
                    input.id = `filter-input-${i}`;

                    const baseClasses = 'w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100';
                    input.className = (i === 2 ? 'text-[10px] ' : 'text-xs ') + baseClasses;
                    if (i === 3) input.classList.add('hide-on-mobile');

                    input.addEventListener('input', handleFilterChange);
                    th.appendChild(input);
                    filterRow.appendChild(th);
                }
                elements.tableHeader.appendChild(filterRow);
            }


            // --- INITIALIZATION & EVENT LISTENERS ---
            function init() {
                initializeTheme();
                initializeFilterRow();
                loadConfigFromLocalStorage();
                updateSortIcons();
                fetchData(true);

                new DateRangePicker('filter-input-2', {
                    locale: {
                        format: "DD/MM/YYYY", applyLabel: "Aplicar", cancelLabel: "Cancelar",
                        daysOfWeek: ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"],
                        monthNames: ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"],
                    },
                    autoApply: true, alwaysShowCalendars: true,
                    ranges: {
                        'Hoje': [moment().startOf('day'), moment().endOf('day')],
                        'Ontem': [moment().subtract(1, 'days').startOf('day'), moment().subtract(1, 'days').endOf('day')],
                        'Últimos 7 Dias': [moment().subtract(6, 'days').startOf('day'), moment().endOf('day')],
                        'Este Mês': [moment().startOf('month').startOf('day'), moment().endOf('month').endOf('day')],
                        'Todos': [moment().startOf('day'), moment.invalid()],
                    },
                });
                document.getElementById('filter-input-2').value = '';

                elements.itemsPerPageSelect.addEventListener('change', () => { state.currentPage = 1; fetchData(); });
                elements.theme.toggleBtn.addEventListener('click', toggleDarkMode);
                elements.modal.configBtn.addEventListener('click', openConfigModal);
                elements.modal.cancelBtn.addEventListener('click', closeConfigModal);
                elements.modal.modal.addEventListener('click', (e) => e.target === elements.modal.modal && closeConfigModal());
                elements.modal.tickerInput.addEventListener('input', () => { state.hasConfigChanged = true; updateConfigButtons(); });

                elements.modal.saveBtn.addEventListener('click', () => {
                    saveConfig();
                    closeConfigModal();
                });

                elements.modal.saveReloadBtn.addEventListener('click', () => {
                    saveConfig();
                    state.currentPage = 1;
                    closeConfigModal();
                    fetchData(true);
                });

                elements.tableHeaders.forEach(header => {
                    header.addEventListener('click', () => {
                        const sortBy = header.getAttribute('data-sort-by');
                        if (sortBy) handleSort(sortBy);
                    });
                });

                window.addEventListener('apply.daterangepicker', (ev) => {
                    if (!ev.detail.endDate.isValid()) {
                        document.getElementById('filter-input-2').value = '';
                    }
                    handleFilterChange();
                });

                elements.updateIndicator.addEventListener('click', () => fetchData(true));
                window.addEventListener('focus', () => {
                    if (state.config.intervalForNewReports === null) {
                        state.config.intervalForNewReports = setInterval(checkForNewReports, constants.NEW_REPORT_CHECK_INTERVAL);
                    }
                });
                window.addEventListener('blur', () => {
                    if (state.config.intervalForNewReports) {
                        clearInterval(state.config.intervalForNewReports);
                        state.config.intervalForNewReports = null;
                    }
                });
            }

            init();
        });
        // =================================================================================
        // SCRIPT END
        // =================================================================================
    </script>
</body>

</html>
